
name: Test TTT Results Analysis

on:
  workflow_dispatch:

jobs:
  test-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandas
        run: python -m pip install pandas

      - name: Run TTT summary script
        run: python src/summarize_ttt_results.py
